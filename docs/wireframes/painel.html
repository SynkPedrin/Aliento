<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wireframe · Painel Alento</title>
<style>
  :root { --bg: #0B1030; --side: #0E1438; --card: #141B47; --line: #263068; --ink: #F2F4FF; --mut: #8F9BD6; --acc: #3EE0B5; --brand: #1E3FFF; --warn: #FFB4A2; }
  * { box-sizing: border-box; margin: 0; }
  body { font: 14px/1.45 system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--ink); display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
  aside { background: var(--side); border-right: 1px solid var(--line); padding: 20px 14px; position: sticky; top: 0; height: 100vh; }
  .logo { font-weight: 700; font-size: 17px; padding: 0 10px 22px; }
  .logo small { font-weight: 500; color: var(--mut); font-size: 11px; margin-left: 6px; border: 1px solid var(--line); padding: 1px 6px; border-radius: 99px; }
  nav a { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; color: var(--mut); text-decoration: none; margin-bottom: 2px; }
  nav a:hover { background: var(--card); color: var(--ink); }
  nav a.on { background: var(--card); color: var(--ink); font-weight: 600; box-shadow: inset 3px 0 0 var(--brand); }
  nav .ic { width: 18px; height: 18px; border: 1.5px solid currentColor; border-radius: 5px; opacity: .7; }
  .who { position: absolute; bottom: 18px; left: 24px; right: 24px; color: var(--mut); font-size: 12px; border-top: 1px solid var(--line); padding-top: 12px; }
  main { padding: 28px 36px 60px; max-width: 1240px; width: 100%; }
  .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
  h1 { font-size: 26px; font-weight: 600; } h2 { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
  .sub { color: var(--mut); margin-top: 4px; }
  .grid { display: grid; gap: 16px; } .g3 { grid-template-columns: repeat(3, 1fr); } .g2 { grid-template-columns: 1fr 1fr; } .g4 { grid-template-columns: repeat(4, 1fr); } .g6 { grid-template-columns: repeat(6, 1fr); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
  .kpi .lbl { color: var(--mut); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
  .kpi .val { font-size: 32px; font-weight: 600; margin: 6px 0 4px; font-variant-numeric: tabular-nums; }
  .kpi .meta { display: flex; justify-content: space-between; color: var(--mut); font-size: 13px; }
  .up { color: var(--acc); } .down { color: var(--warn); }
  .seg { display: inline-flex; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; }
  .seg button { background: none; border: 0; color: var(--mut); padding: 7px 12px; border-radius: 8px; font: inherit; cursor: pointer; }
  .seg button.on { background: var(--brand); color: #fff; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; color: var(--mut); font-weight: 500; font-size: 12px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  td { padding: 11px 10px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  tr.click { cursor: pointer; } tr.click:hover td { background: rgba(255,255,255,.03); }
  .num { text-align: right; }
  .chip { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 12px; border: 1px solid var(--line); color: var(--mut); }
  .chip.g { color: var(--acc); border-color: rgba(62,224,181,.4); } .chip.r { color: var(--warn); border-color: rgba(255,180,162,.4); }
  .tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--line); margin-bottom: 0; }
  .tabs span { padding: 10px 0; color: var(--mut); cursor: pointer; } .tabs span.on { color: var(--ink); box-shadow: inset 0 -2px 0 var(--brand); }
  .chart { background: #070A20; border-radius: 10px; margin-top: 16px; position: relative; }
  .chart svg { display: block; width: 100%; height: 340px; }
  .metric .v { font-size: 22px; font-weight: 600; } .metric .l { color: var(--mut); font-size: 12px; margin-top: 2px; }
  .funnel-card { display: grid; gap: 10px; cursor: pointer; } .funnel-card:hover { border-color: var(--brand); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .spark { height: 36px; } .muted { color: var(--mut); }
  .drawer { position: fixed; top: 0; right: 0; width: 440px; height: 100vh; background: var(--side); border-left: 1px solid var(--line); padding: 24px; overflow: auto; transform: translateX(100%); transition: transform .25s; }
  .drawer.open { transform: none; }
  dl { display: grid; grid-template-columns: 130px 1fr; gap: 8px 12px; } dt { color: var(--mut); }
  .steps { display: flex; gap: 0; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  .step { background: #0B1030; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 150px; }
  .arrow { color: var(--mut); padding: 0 8px; }
  input, select { background: #0B1030; border: 1px solid var(--line); color: var(--ink); border-radius: 8px; padding: 9px 10px; font: inherit; width: 100%; }
  label { display: grid; gap: 6px; color: var(--mut); font-size: 12px; }
  .btn { background: var(--brand); color: #fff; border: 0; border-radius: 10px; padding: 9px 14px; font: inherit; cursor: pointer; white-space: nowrap; }
  .btn.ghost { background: none; border: 1px solid var(--line); color: var(--ink); }
  .note { border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; color: var(--mut); font-size: 12.5px; margin-top: 14px; }
  .net { display: grid; grid-template-columns: 220px 1fr; gap: 0; } .net-list a { display: block; padding: 12px 14px; border-radius: 10px; color: var(--mut); text-decoration: none; } .net-list a.on { background: var(--card); color: var(--ink); }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; background: var(--acc); } .dot.off { background: #555E99; }
  .chat { height: 300px; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; }
  .bubble { background: #0B1030; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; max-width: 70%; } .bubble.me { align-self: flex-end; background: var(--brand); border-color: var(--brand); }
  .wf { position: fixed; bottom: 12px; right: 16px; font-size: 11px; color: var(--mut); background: var(--card); border: 1px solid var(--line); padding: 4px 10px; border-radius: 99px; }
</style>
</head>
<body>
<aside>
  <div class="logo">Alento <small>Gestão</small></div>
  <nav id="nav"></nav>
  <div class="who">gui@alento · Administrador</div>
</aside>
<main id="main"></main>
<div class="drawer" id="drawer"></div>
<div class="wf">WIREFRAME · dados fictícios</div>

<script>
const $ = (s) => document.querySelector(s);
const brl = (v) => 'US$ ' + v.toLocaleString('pt-BR', { minimumFractionDigits: 2 });
const SCREENS = [['geral', 'Visão geral'], ['funis', 'Funis'], ['vendas', 'Vendas'], ['emails', 'Funis de e-mail'], ['ia', 'Modo IA'], ['track', 'Traqueamento'], ['config', 'Configurações']];
const period = (on = '7d') => `<div class="seg">${[['hoje', 'Hoje'], ['7d', '7 dias'], ['30d', '30 dias'], ['pers', 'Personalizado']].map(([k, l]) => `<button class="${k === on ? 'on' : ''}">${l}</button>`).join('')}</div>`;

// Curva de retenção estilo VTurb: eixo X = telas do quiz até a compra.
const STEPS = ['Abertura', 'Gênero', 'Idade', 'Médico', 'Não está só', 'Produto', 'Anos', 'Texto anos', 'Frequência', '1ª dose', 'Doente', 'Proibido', '24 h', 'Cérebro', 'Consumo', 'Gatilhos', 'Medo', 'Segredo', 'Amigo', 'Gosta', 'Amigo+prazer', 'Tentativas', 'Objetivo', 'Gasto', 'Economia', 'Dinheiro', '3 meses', 'Metas', 'Ciência', 'Análise', 'E-mail', 'Nome', 'Tipo', 'Significado', 'Projeção', 'Venda', 'Checkout', 'Compra'];
const RET = [100, 91, 88, 86, 85, 83, 81, 80, 78, 77, 76, 75, 72, 71, 70, 68, 66, 65, 64, 62, 61, 60, 59, 57, 56, 55, 54, 53, 52, 51, 34, 31, 30, 27, 25, 21, 9, 3.1];
function retentionChart() {
  const W = 1000, H = 340, L = 44, B = 30, T = 14, R = 10, iw = W - L - R, ih = H - T - B, n = STEPS.length;
  const x = (i) => L + (i / (n - 1)) * iw, y = (v) => T + ih - (v / 100) * ih;
  let d = `M${x(0)},${y(RET[0])}`; RET.forEach((v, i) => { if (i) d += ` H${x(i)} V${y(v)}`; });
  const grid = [0, 20, 40, 60, 80, 100].map((v) => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#1B2252"/><text x="${L - 8}" y="${y(v) + 4}" fill="#8F9BD6" font-size="11" text-anchor="end">${v}%</text>`).join('');
  const marks = [['E-mail', 30, 12], ['Venda', 35, 12], ['Checkout', 36, 28]].map(([l, i, dy]) => `<line x1="${x(i)}" x2="${x(i)}" y1="${T}" y2="${T + ih}" stroke="#FFB4A2" stroke-dasharray="3 4" opacity=".6"/><text x="${x(i) - 4}" y="${T + dy}" fill="#FFB4A2" font-size="11" text-anchor="end">${l}</text>`).join('');
  const labels = [0, 7, 15, 23, 30, 37].map((i) => `<text x="${x(i)}" y="${H - 8}" fill="#8F9BD6" font-size="11" text-anchor="middle">${STEPS[i]}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${grid}${marks}<path d="${d} V${y(0)} H${x(0)} Z" fill="rgba(62,224,181,.16)"/><path d="${d}" fill="none" stroke="#3EE0B5" stroke-width="2"/>${labels}<circle cx="${x(30)}" cy="${y(34)}" r="4" fill="#fff"/></svg>`;
}

const SALES = [
  ['23/10 14:12', 'Lucía M.', 'Plan de 3 meses', 34.99, 'facebook', 'fumo-es-c3', 'video-ansiedad-02', 'ES'],
  ['23/10 13:40', 'Javier R.', 'Prueba de una semana', 7.99, 'tiktok', 'fumo-es-tt1', 'ugc-cafe-01', 'MX'],
  ['23/10 11:05', 'Ana P.', 'Plan de 1 mes', 19.99, 'facebook', 'fumo-es-c1', 'carrossel-pulmon', 'ES'],
  ['22/10 22:51', 'Carlos D.', 'Plan de 3 meses', 34.99, '(direto)', '—', '—', 'US'],
  ['22/10 19:30', 'Marta G.', 'Plan de 3 meses (−20% volta)', 27.99, 'facebook', 'fumo-es-c3', 'video-ansiedad-02', 'ES'],
];

const views = {
  geral: () => `
    <div class="head"><div><h1>Visão geral</h1><p class="sub">Faturamento confirmado pelo Stripe.</p></div></div>
    <div class="grid g3">
      ${[['Hoje', 82.97, 3, '+12%'], ['Últimos 7 dias', 1184.4, 41, '+8%'], ['Últimos 30 dias', 4920.15, 172, '−3%']].map(([l, v, o, c]) => `
      <div class="card kpi"><div class="lbl">${l}</div><div class="val">${brl(v)}</div>
      <div class="meta"><span>${o} vendas</span><span class="${c.startsWith('+') ? 'up' : 'down'}">${c} vs. período anterior</span></div></div>`).join('')}
    </div>
    <div class="grid g2" style="margin-top:16px">
      <div class="card"><h2>Funis ativos · hoje</h2><table><tr><th>Funil</th><th class="num">Visitas</th><th class="num">Conversão</th><th class="num">Faturamento</th></tr>
        <tr class="click" onclick="go('funil')"><td>Sem Fumo · ES</td><td class="num">412</td><td class="num">0,7%</td><td class="num">${brl(82.97)}</td></tr>
        <tr><td class="muted">Sem Fumo · EN</td><td class="num muted">—</td><td class="num muted">—</td><td class="num muted">em breve</td></tr></table></div>
      <div class="card"><h2>Últimas vendas</h2><table>${SALES.slice(0, 4).map((s) => `<tr class="click" onclick="go('vendas')"><td>${s[0]}</td><td>${s[1]}</td><td><span class="chip">${s[4]}</span></td><td class="num">${brl(s[3])}</td></tr>`).join('')}</table></div>
    </div>
    <div class="note">Sem filtros nesta tela. Gasto com anúncios fica de fora por enquanto.</div>`,

  funis: () => `
    <div class="head"><div><h1>Funis</h1><p class="sub">Cada quiz é um funil. Clique para ver a retenção tela a tela.</p></div>${period()}</div>
    <div class="grid g3">
      ${[['Sem Fumo · ES', 'Espanhol · /quiz/sem-fumo', 2840, '61%', '0,9%', 1184.4, true], ['Sem Fumo · EN', 'Inglês', 0, '—', '—', 0, false], ['Álcool · ES', 'Em breve', 0, '—', '—', 0, false]].map(([n, s, v, c, conv, r, on]) => `
      <div class="card funnel-card" ${on ? `onclick="go('funil')"` : 'style="opacity:.5"'}>
        <div class="row"><strong>${n}</strong><span class="chip ${on ? 'g' : ''}">${on ? 'ativo' : 'inativo'}</span></div><span class="muted">${s}</span>
        <svg class="spark" viewBox="0 0 100 30" preserveAspectRatio="none"><path d="M0,2 H8 V6 H20 V9 H35 V12 H50 V14 H62 V20 H75 V23 H90 V27 H100" fill="none" stroke="${on ? '#3EE0B5' : '#555E99'}" stroke-width="1.5"/></svg>
        <div class="grid g3"><div class="metric"><div class="v">${v.toLocaleString('pt-BR')}</div><div class="l">Visitas</div></div><div class="metric"><div class="v">${conv}</div><div class="l">Conversão</div></div><div class="metric"><div class="v">${r ? brl(r) : '—'}</div><div class="l">Faturamento</div></div></div>
      </div>`).join('')}
    </div>`,

  funil: () => `
    <div class="head"><div><p class="muted" style="cursor:pointer" onclick="go('funis')">← Funis</p><h1>Sem Fumo · ES</h1></div>${period()}</div>
    <div class="card">
      <div class="row"><div class="tabs"><span class="on">Retenção geral</span><span>Países</span><span>Dispositivos</span><span>Origem do tráfego</span><span>Idioma</span></div><span class="muted">Comparar origens ▾</span></div>
      <div class="chart">${retentionChart()}</div>
      <p class="muted" style="margin-top:8px;font-size:12px">Passe o mouse: mostra a tela, % que chegou e quantas pessoas saíram ali. Maior queda: <b style="color:#FFB4A2">E-mail (−17 p.p.)</b></p>
    </div>
    <h2 style="margin:22px 0 12px">Métricas</h2>
    <div class="grid g6">
      ${[['2.840', 'Visitas'], ['1.733', 'Iniciaram o quiz'], ['61%', 'Taxa de início'], ['1.448', 'Chegaram à análise'], ['966', 'Leads (e-mail)'], ['34%', 'Taxa de lead'], ['596', 'Viram a oferta'], ['255', 'Abriram checkout'], ['26', 'Compras'], ['0,9%', 'Conversão'], [brl(1184.4), 'Faturamento'], [brl(45.55), 'Ticket médio']].map(([v, l]) => `<div class="card metric"><div class="v">${v}</div><div class="l">${l}</div></div>`).join('')}
    </div>
    <div class="card" style="margin-top:16px"><h2>Tela a tela</h2><table><tr><th>#</th><th>Tela</th><th class="num">Pessoas</th><th class="num">Retenção</th><th class="num">Saída nesta tela</th><th class="num">Tempo médio</th></tr>
      ${STEPS.slice(0, 8).map((s, i) => `<tr><td>${i + 1}</td><td>${s}</td><td class="num">${Math.round(1733 * RET[i] / 100)}</td><td class="num">${RET[i]}%</td><td class="num ${i && RET[i - 1] - RET[i] > 5 ? 'down' : ''}">${i ? (RET[i - 1] - RET[i]).toFixed(0) + ' p.p.' : '—'}</td><td class="num">${(3 + i % 4)},${i % 9}s</td></tr>`).join('')}
      <tr><td colspan="6" class="muted">… todas as 38 telas</td></tr></table></div>`,

  vendas: () => `
    <div class="head"><div><h1>Vendas</h1><p class="sub">Clique numa venda para ver cliente, UTMs e eventos enviados ao Meta/TikTok.</p></div>${period()}</div>
    <div class="grid g4" style="margin-bottom:16px">${[[brl(1184.4), 'Faturamento'], ['41', 'Vendas'], [brl(28.89), 'Ticket médio'], ['3', 'Reembolsos']].map(([v, l]) => `<div class="card metric"><div class="v">${v}</div><div class="l">${l}</div></div>`).join('')}</div>
    <div class="card"><div class="row" style="margin-bottom:10px"><div class="seg"><button class="on">Todas</button><button>Novas</button><button>Renovações</button><button>Reembolsos</button></div><input style="max-width:260px" placeholder="Buscar e-mail ou nome"></div>
      <table><tr><th>Data</th><th>Cliente</th><th>Plano</th><th>Origem</th><th>Campanha</th><th>Criativo</th><th>País</th><th class="num">Valor</th></tr>
      ${SALES.map((s, i) => `<tr class="click" onclick="sale(${i})"><td>${s[0]}</td><td>${s[1]}</td><td>${s[2]}</td><td><span class="chip">${s[4]}</span></td><td class="muted">${s[5]}</td><td class="muted">${s[6]}</td><td>${s[7]}</td><td class="num">${brl(s[3])}</td></tr>`).join('')}</table></div>`,

  emails: () => `
    <div class="head"><div><h1>Funis de e-mail</h1><p class="sub">Sequências automáticas por funil (Resend).</p></div><button class="btn">+ Nova sequência</button></div>
    ${[['Lead sem compra', 'Deixou e-mail no quiz e não comprou', ['E-mail 1 · 1 h depois', 'E-mail 2 · 1 dia', 'E-mail 3 · 3 dias', 'E-mail 4 · 7 dias'], '966', '41%', '6,2%', '14'], ['Checkout abandonado', 'Abriu o checkout e não pagou', ['E-mail 1 · 30 min', 'E-mail 2 · 1 dia (cupom 20%)'], '229', '52%', '9,8%', '11'], ['Boas-vindas', 'Comprou', ['Acesso ao app · na hora', 'Dica dia 3', 'Check-in dia 7'], '41', '68%', '—', '—']].map(([n, t, steps, sent, open, click, sales]) => `
      <div class="card" style="margin-bottom:14px"><div class="row"><div><strong>${n}</strong><p class="muted">Gatilho: ${t} · Funil: Sem Fumo · ES</p></div><span class="chip g">ativo</span></div>
      <div class="steps">${steps.map((s, i) => `${i ? '<span class="arrow">→</span>' : ''}<div class="step">${s}</div>`).join('')}</div>
      <div class="grid g4" style="margin-top:14px">${[[sent, 'Pessoas na sequência'], [open, 'Abertura'], [click, 'Cliques'], [sales, 'Vendas geradas']].map(([v, l]) => `<div class="metric"><div class="v">${v}</div><div class="l">${l}</div></div>`).join('')}</div></div>`).join('')}`,

  ia: () => `
    <div class="head"><div><h1>Modo IA</h1><p class="sub">Pergunte sobre funis, vendas e e-mails. A IA só lê os dados, não muda nada.</p></div></div>
    <div class="grid" style="grid-template-columns:2fr 1fr">
      <div class="card"><div class="chat">
        <div class="bubble me">Onde estou perdendo mais gente no quiz do Sem Fumo esta semana?</div>
        <div class="bubble">A maior saída é na tela de e-mail: 51% chegam, 34% deixam o e-mail (−17 p.p.). No celular a queda é maior (−21 p.p.). Sugestão: testar o texto do botão e tirar a 2ª caixinha.</div>
      </div><div class="row" style="margin-top:12px"><input placeholder="Pergunte algo…"><button class="btn">Enviar</button></div></div>
      <div class="card"><h2>Relatórios automáticos</h2><table><tr><td>Diário · 23/10</td><td class="num muted">abrir</td></tr><tr><td>Semanal · 20/10</td><td class="num muted">abrir</td></tr></table>
      <div class="note">Sugestões rápidas: “Qual criativo traz compradores?”, “Compare ES e MX”, “Por que caiu ontem?”</div></div>
    </div>`,

  track: () => `
    <div class="head"><div><h1>Traqueamento</h1><p class="sub">Uma rede por vez. Pixel no navegador + API de conversões no servidor (não perde venda quando o pixel falha).</p></div></div>
    <div class="net">
      <div class="net-list">${[['Meta (Facebook/Instagram)', 1], ['TikTok Ads', 1], ['Google Ads', 0]].map(([n, on], i) => `<a class="${i ? '' : 'on'}" href="#"><span class="dot ${on ? '' : 'off'}"></span>${n}</a>`).join('')}</div>
      <div class="card">
        <div class="row"><h2 style="margin:0">Meta</h2><span class="chip g">conectado · último evento há 3 min</span></div>
        <div class="grid g2" style="margin-top:14px"><label>ID do Pixel<input value="1234567890"></label><label>Token da API de conversões<input value="••••••••••••"></label><label>Código de evento de teste<input placeholder="TEST1234"></label><label>&nbsp;<button class="btn ghost">Enviar evento de teste</button></label></div>
        <h2 style="margin-top:20px">Eventos enviados (24 h)</h2>
        <table><tr><th>Evento</th><th>Quando dispara</th><th class="num">Navegador</th><th class="num">Servidor</th><th class="num">Status</th></tr>
        ${[['PageView', 'Abriu o quiz', 2840, 2840], ['Lead', 'Deixou e-mail', 966, 966], ['InitiateCheckout', 'Abriu checkout', 255, 255], ['Purchase', 'Pagamento confirmado no Stripe', 22, 26]].map(([e, w, b, s]) => `<tr><td>${e}</td><td class="muted">${w}</td><td class="num">${b}</td><td class="num">${s}</td><td class="num"><span class="chip g">ok</span></td></tr>`).join('')}</table>
        <h2 style="margin-top:20px">Parâmetros para os anúncios</h2>
        <input readonly value="utm_source=facebook&utm_medium=paid&utm_campaign={{campaign.name}}&utm_content={{ad.name}}&utm_term={{adset.name}}">
        <div class="note">Purchase pelo servidor = 26 vs. pixel = 22: as 4 vendas que o pixel perdeu chegam ao Meta pela API.</div>
      </div>
    </div>`,

  config: () => `
    <div class="head"><div><h1>Configurações</h1></div></div>
    <div class="grid g2">
      <div class="card"><h2>Usuários</h2><table><tr><th>Nome</th><th>E-mail</th><th>Função</th><th></th></tr>
        <tr><td>Gui</td><td>gui@alento</td><td>Administrador</td><td class="num muted">—</td></tr><tr><td>Ana</td><td>ana@alento</td><td>Marketing</td><td class="num muted">remover</td></tr></table>

<main>

<!-- 2 · Hero -->
<section class="hero t-blue reveal">
  <div class="ring breathe" style="width:1100px;height:1100px;right:-380px;top:-420px"></div>
  <div class="ring" style="width:720px;height:720px;left:-360px;bottom:-420px"></div>
  <div class="wrap hero__in">
    <div class="hero__text">
      <div class="eyebrow" data-r data-i18n="hero.eyebrow"></div>
      <h1 class="d hero__title lines" data-r="fade"><span><span style="--k:0" data-i18n="hero.l1"></span></span><span><span style="--k:1" data-i18n="hero.l2"></span></span></h1>

      <div class="hero__cta" data-r data-d=".65">
        <a class="btn btn--mint" href="/acceso?modo=entrar" data-i18n="cta.login"></a>
        <a class="btn btn--ghost-light" href="#como-funciona" data-i18n="cta.how"></a>
      </div>
    </div>
    <div class="hero__media" aria-hidden="true">
      <div class="hero__sun" data-r="soft" data-d=".9"><span class="breathe"></span></div>

    </div>
  </div>
</section>

      <div class="eyebrow" data-r data-i18n="goals.eyebrow"></div>
      <h2 class="d h2" data-r data-i18n="goals.title"></h2>
    </div>
    <div class="goals">
      <div class="goal" data-r data-d=".2"><div class="goal__art"><div data-sym-accent="mint"></div></div><div class="goal__name" data-i18n="goal.smoke"></div><p data-i18n="goal.smoke.t"></p></div>
      <div class="goal" data-r data-d=".28"><div class="goal__art"><div data-sym-accent="lav"></div></div><div class="goal__name" data-i18n="goal.alcohol"></div><p data-i18n="goal.alcohol.t"></p></div>
      <div class="goal" data-r data-d=".36"><div class="goal__art"><div data-sym-accent="coral"></div></div><div class="goal__name" data-i18n="goal.sugar"></div><p data-i18n="goal.sugar.t"></p></div>
      <div class="goal" data-r data-d=".44"><div class="goal__art"><div data-sym-accent="amber"></div></div><div class="goal__name" data-i18n="goal.anxiety"></div><p data-i18n="goal.anxiety.t"></p></div>

  </div>
</section>

</section>

</section>

<section class="sec t-air reveal" id="como-funciona">

  </div>

    <div class="sec__head center">
